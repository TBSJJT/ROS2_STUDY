# ============================================================================
# GasRobot 巡检场地与路线配置模板
#
# 使用方法：
#   1. 在 RViz 中确认机器人初始化位姿和每个巡检点；
#   2. 将 map 坐标系中的 x、y 和朝向填写到本文件；
#   3. 完成实地核验后，把 site_configured 改为 true；
#   4. 未完成标定时节点会拒绝启动，防止机器人驶向模板零坐标。
#
# yaw_deg 使用角度，逆时针为正；节点会自动转换为 ROS 使用的四元数。
# ============================================================================
version: 1
frame_id: map
site_configured: false

# AMCL 初始化位姿。只有机器人每次都从固定停靠位上电时才建议自动发布。
initial_pose:
  x: 0.0
  y: 0.0
  yaw_deg: 0.0
  covariance:
    # 分别对应 PoseWithCovariance 的 x、y 和 yaw 对角项。
    x: 0.25
    y: 0.25
    yaw: 0.0685

routes:
  standard_route:
    description: 标准气体泄漏巡检路线
    target_gas: methane
    alarm_threshold: 1000.0
    stop_on_critical_risk: true

    # repeat_count 表示整条路线执行圈数；每个巡检点可覆盖默认停留时间。
    repeat_count: 1
    default_dwell_sec: 5.0

    # 单点导航失败后的工程处理策略。
    max_retries: 2
    continue_on_failure: false
    navigation_timeout_sec: 180.0

    waypoints:
      - id: charging_station
        description: 固定停靠与任务起点
        x: 0.0
        y: 0.0
        yaw_deg: 0.0
        dwell_sec: 2.0

      - id: inspection_area_a
        description: A 区管线与阀门巡检点
        x: 0.0
        y: 0.0
        yaw_deg: 0.0

      - id: inspection_area_b
        description: B 区设备接口巡检点
        x: 0.0
        y: 0.0
        yaw_deg: 0.0

      - id: return_station
        description: 完成巡检后返回停靠区
        x: 0.0
        y: 0.0
        yaw_deg: 180.0
        dwell_sec: 0.0
