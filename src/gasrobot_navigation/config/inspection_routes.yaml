# ============================================================================
# GasRobot 巡检场地与路线配置模板
#
# 使用方法：
#   1. 在 RViz 中确认机器人初始化位姿和每个巡检点；
#   2. 将 map 坐标系中的 x、y 和朝向填写到本文件；
#   3. 完成实地核验后，把 site_configured 改为 true；
#   4. 未完成标定时节点会拒绝启动，防止机器人驶向模板零坐标。
#
# yaw_deg 使用角度，逆时针为正；节点会自动转换为 ROS 使用的四元数。
# ============================================================================
version: 1
frame_id: map
site_configured: true

# AMCL 初始化位姿。只有机器人每次都从固定停靠位上电时才建议自动发布。
initial_pose:
  x: 0.0
  y: 0.0
  yaw_deg: 0.0
  covariance:
    
    # 协方差，分别对应 PoseWithCovariance 的 x、y 和 yaw 对角项。
    x: 0.25
    y: 0.25
    yaw: 0.0685

routes:
  standard_route:
    description: 当前场地气体巡检路线
    target_gas: methane
    alarm_threshold: 1000.0
    stop_on_critical_risk: true

    repeat_count: 1
    default_dwell_sec: 5.0
    max_retries: 2
    continue_on_failure: false
    navigation_timeout_sec: 180.0

    waypoints:
      - id: inspection_point_01
        description: 第一个气体巡检点
        x: 1.7866
        y: -1.4502
        yaw_deg: 0.0
        dwell_sec: 8.0

      - id: inspection_point_02
        description: 第二个气体巡检点
        x: -2.1142
        y: 3.9452
        yaw_deg: 0.0
        dwell_sec: 8.0

        