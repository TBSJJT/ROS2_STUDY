# =====================================================================
# Nav2 实车导航参数文件（详细中文注释版）
#
# 适用场景：
#   1. ROS 2 Humble
#   2. 已保存地图 + AMCL 定位 + Nav2 单点导航
#   3. 实车运行，因此 use_sim_time 必须为 false
#   4. 当前先把麦克纳姆底盘按“差速底盘”使用，不启用 linear.y 横移
#
# 当前坐标链预期为：
#   map -> odom -> base_footprint -> base_link -> laser_link
#
# 当前机器人外形：
#   实测约 0.30 m × 0.305 m
#   配置中四周各额外预留约 1 cm，因此 footprint 为 0.32 m × 0.325 m
#
# 重要提醒：
#   controller_server 与 velocity_smoother 的线速度上限均为 0.10 m/s，
#   修改巡检速度时必须同步修改两处，避免控制器和速度平滑器限值不一致。
# =====================================================================


# =====================================================================
# 1. AMCL：在已保存地图中估计机器人位置
# =====================================================================
amcl:
  ros__parameters:
    # 实车使用系统时间，不能使用 Gazebo 的 /clock
    use_sim_time: false

    # 里程计运动模型噪声参数。
    # 数值越大，AMCL 越不信任里程计，粒子扩散越明显。
    # alpha1：旋转运动造成的旋转误差
    alpha1: 0.2
    # alpha2：平移运动造成的旋转误差
    alpha2: 0.2
    # alpha3：平移运动造成的平移误差
    alpha3: 0.2
    # alpha4：旋转运动造成的平移误差
    alpha4: 0.2
    # alpha5：全向运动模型中的横向误差；差速模型中影响较小
    alpha5: 0.2

    # AMCL认为机器人主体所在的TF坐标系
    base_frame_id: "base_footprint"

    # 以下参数用于激光束跳过机制。
    # 当前 do_beamskip=false，因此暂时不会启用束跳过。
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false

    # 全局地图坐标系
    global_frame_id: "map"

    # 激光模型中“意外短测距”的指数分布参数
    lambda_short: 0.1

    # likelihood_field 激光模型查询障碍物距离场时的最大距离
    laser_likelihood_max_dist: 2.0

    # AMCL接受的雷达最大、最小量程。
    # -1.0通常表示使用LaserScan消息中的range_min。
    laser_max_range: 100.0
    laser_min_range: -1.0

    # 使用似然场模型匹配地图，比逐束射线模型通常更平滑
    laser_model_type: "likelihood_field"

    # 每次激光更新最多抽取多少条光束参与定位
    max_beams: 60

    # 粒子数量上下限。
    # 粒子越多定位更稳，但CPU开销更大。
    max_particles: 2000
    min_particles: 500

    # 里程计坐标系名称
    odom_frame_id: "odom"

    # KLD自适应采样参数：
    # pf_err越小、pf_z越高，通常会保留更多粒子
    pf_err: 0.05
    pf_z: 0.99

    # 随机恢复参数。
    # 设为0表示关闭基于快速/慢速权重差异的随机粒子注入。
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # 每次滤波更新后都进行重采样
    resample_interval: 1

    # 当前使用差速运动模型。
    # 虽然底盘是麦克纳姆轮，但首次导航关闭了linear.y，可先按差速模式测试。
    # robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # 麦克纳姆轮属于全向底盘
    robot_model_type: "nav2_amcl::OmniMotionModel"
    # 每秒保存上次定位姿态的频率
    save_pose_rate: 0.5

    # 激光命中高斯模型标准差
    sigma_hit: 0.2

    # AMCL是否发布 map -> odom TF
    tf_broadcast: true

    # TF允许的时间容差，单位秒
    transform_tolerance: 1.0

    # 机器人旋转至少0.2 rad后，AMCL才使用新激光更新
    update_min_a: 0.2

    # 机器人平移至少0.15 m后，AMCL才使用新激光更新
    update_min_d: 0.15

    # 激光模型各组成概率权重
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05

    # AMCL订阅的激光话题；相对名称最终通常解析为 /scan
    scan_topic: /scan


# =====================================================================
# 2. BT Navigator：执行导航行为树
# =====================================================================
bt_navigator:
  ros__parameters:
    use_sim_time: false

    # 行为树使用的全局坐标系
    global_frame: map

    # 机器人主体坐标系
    robot_base_frame: base_footprint

    # 行为树读取的里程计话题
    odom_topic: /odom

    # 行为树主循环周期，单位毫秒
    bt_loop_duration: 10

    # 动作或服务的默认等待超时，单位毫秒
    default_server_timeout: 20
    wait_for_service_timeout: 1000

    # 下列库是Nav2行为树可调用的动作、条件和控制节点插件。
    # 通常保持官方默认列表即可，不需要为单点导航逐个修改。
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node


# 以下两个节点分别服务于“多目标点导航”和“单目标点导航”
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false


# =====================================================================
# 3. Controller Server：局部路径跟踪与速度计算
# =====================================================================
controller_server:
  ros__parameters:
    use_sim_time: false

    # 局部控制器运行频率，20 Hz表示每0.05秒计算一次速度
    controller_frequency: 20.0

    # 小于阈值的速度会被视为0，主要用于过滤数值噪声
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    # 控制器失败后允许容忍的时间，单位秒
    failure_tolerance: 0.3

    # 指定使用哪个进度检测插件、目标检测插件和控制器插件
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # ---------------------------------------------------------------
    # 3.1 进度检测：判断机器人是否卡住
    # ---------------------------------------------------------------
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"

      # 在movement_time_allowance时间内至少移动0.1 m，
      # 否则可能被认为没有取得进展。
      required_movement_radius: 0.1

      # 允许机器人10秒内完成上述移动
      movement_time_allowance: 10.0

    # ---------------------------------------------------------------
    # 3.2 目标到达判定
    # ---------------------------------------------------------------
    general_goal_checker:
      # stateful=true表示进入目标位置容差后，会继续处理最终朝向，
      # 不会因为轻微位置波动反复退出目标区域。
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"

      # 到目标点平面距离小于0.10 m，认为位置到达
      xy_goal_tolerance: 0.10

      # 最终朝向误差小于0.10 rad（约5.7° 角度=0.1*180/3.14），认为姿态到达
      yaw_goal_tolerance: 0.10

    # ---------------------------------------------------------------
    # 3.3 DWB局部控制器
    # ---------------------------------------------------------------
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # 生产运行默认关闭轨迹评价调试输出，需要调参时再临时开启
      debug_trajectory_details: False

      # x方向最小/最大速度，单位m/s
      min_vel_x: 0.0
      # 首轮中间走廊巡检限速为0.10 m/s，便于观察路径和连续气体数据。
      max_vel_x: 0.10

      # 麦克纳姆底盘允许y方向横移，首轮测试同样限制为0.10 m/s。
      min_vel_y: -0.10
      max_vel_y: 0.10

      # 最大角速度，单位rad/s
      max_vel_theta: 0.4

      # 平面合速度上下限
      min_speed_xy: 0.0
      max_speed_xy: 0.10

      # 最小角速度设为0，允许控制器输出很小角速度
      min_speed_theta: 0.0

      # 最大加速度，单位：
      # x/y为m/s²，theta为rad/s²
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 0.8

      # 最大减速度使用负数表示
      decel_lim_x: -0.3
      decel_lim_y: -0.30
      decel_lim_theta: -0.8

      # 在速度空间中采样的候选数量。
      # 数量越大轨迹搜索更细，但CPU开销更高。
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20

      # 每条候选速度向前仿真的时长，单位秒
      sim_time: 1.7

      # 轨迹离散检查的线性和角度步长
      linear_granularity: 0.05
      angular_granularity: 0.025

      # 控制器查找TF时允许的时间误差
      transform_tolerance: 0.2

      # DWB内部使用的目标位置容差
      xy_goal_tolerance: 0.10

      # 平移速度低于0.05 m/s时可视为基本停止
      trans_stopped_velocity: 0.05

      # 某个轨迹评分项已经判定不合格时，提前停止后续评分
      short_circuit_trajectory_evaluation: True

      # 保持目标检查状态
      stateful: True

      # 候选轨迹评分器。
      # DWB会综合障碍物、路径、目标和旋转等评分选出速度。
      critics:
        ["RotateToGoal", "Oscillation", "BaseObstacle",
         "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

      # 障碍物碰撞评分权重
      BaseObstacle.scale: 0.02

      # 与全局路径方向对齐的评分权重
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1

      # 与目标方向对齐的评分权重
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1

      # 距离全局路径的评分权重
      PathDist.scale: 32.0

      # 距离目标点的评分权重
      GoalDist.scale: 24.0

      # 接近目标时原地旋转评分
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


# =====================================================================
# 4. Local Costmap：机器人附近的滚动局部代价地图
# =====================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      # 局部代价地图内部更新频率
      update_frequency: 5.0

      # 向RViz等订阅者发布的频率
      publish_frequency: 2.0

      # 局部代价地图通常使用odom，避免map定位跳变影响局部控制
      global_frame: odom

      # 机器人主体坐标系
      robot_base_frame: base_footprint

      use_sim_time: false

      # true表示局部地图窗口随机器人移动
      rolling_window: true

      # 局部窗口大小：3 m × 3 m
      width: 3
      height: 3

      # 每个栅格边长5 cm
      resolution: 0.05

      # 当前使用矩形轮廓，不使用圆形robot_radius
      footprint: "[[-0.16, -0.1625], [-0.16, 0.1625], [0.16, 0.1625], [0.16, -0.1625]]"

      # 局部地图加载体素障碍层和膨胀层。
      # static_layer虽然在下方定义，但未放进plugins，因此不会被局部地图加载。
      plugins: ["voxel_layer", "inflation_layer"]

      # ---------------------------------------------------------------
      # 4.1 障碍物膨胀层
      # ---------------------------------------------------------------
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        # 代价值随距离衰减的快慢，越大衰减越快
        cost_scaling_factor: 3.0

        # 障碍物周围0.20 m范围内产生膨胀代价
        inflation_radius: 0.20

      # ---------------------------------------------------------------
      # 4.2 三维体素障碍层
      # ---------------------------------------------------------------
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True

        # 轻量 RViz 不订阅体素点云，默认不发布以减少虚拟机通信与渲染负担
        publish_voxel_map: False

        # 体素层从z=0开始
        origin_z: 0.0

        # 每个体素高度5 cm，共16层，即总高度约0.8 m
        z_resolution: 0.05
        z_voxels: 16

        # 高于2 m的障碍物点忽略
        max_obstacle_height: 2.0

        # 标记占用体素所需的最小点数
        mark_threshold: 0

        # 此层使用scan作为观测源
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 2.0

          # clearing=true：用雷达射线清除空闲区域
          clearing: True

          # marking=true：把雷达命中点标记为障碍物
          marking: True

          data_type: "LaserScan"

          # 清障射线使用的距离范围
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

          # 实际标记障碍物的距离范围
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      # 该层当前没有加入plugins，只保留定义
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      # 每次发布完整代价地图，而不是只发布更新区域
      always_send_full_costmap: True


# =====================================================================
# 5. Global Costmap：全局规划使用的代价地图
# =====================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      # 全局地图更新和发布频率
      update_frequency: 1.0
      publish_frequency: 1.0

      # 全局代价地图必须使用map坐标系
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false

      # 使用与局部地图相同的机器人矩形轮廓
      footprint: "[[-0.16, -0.1625], [-0.16, 0.1625], [0.16, 0.1625], [0.16, -0.1625]]"

      resolution: 0.05

      # 保留未知区域，使规划器可根据allow_unknown决定是否穿越
      track_unknown_space: true

      # 全局地图包含：
      # 静态地图层 + 实时障碍层 + 膨胀层
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      # ---------------------------------------------------------------
      # 5.1 实时障碍层
      # ---------------------------------------------------------------
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      # ---------------------------------------------------------------
      # 5.2 静态地图层
      # ---------------------------------------------------------------
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

        # 使用Transient Local QoS，确保后启动的代价地图也能收到地图
        map_subscribe_transient_local: True

      # ---------------------------------------------------------------
      # 5.3 膨胀层
      # ---------------------------------------------------------------
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.20

      always_send_full_costmap: True


# =====================================================================
# 6. Map Server：读取保存好的地图
# =====================================================================
map_server:
  ros__parameters:
    use_sim_time: false

    # 保持空字符串是正常的：
    # bringup_launch.py会使用命令行的map:=...覆盖该参数。
    # 例如：
    # map:=/userdata/iceice/gasrobot_ws/src/gasrobot_gas_mapping/maps/gasrobot_map.yaml
    yaml_filename: ""


# =====================================================================
# 7. Map Saver：保存地图时使用
# =====================================================================
map_saver:
  ros__parameters:
    use_sim_time: false

    # 保存地图服务的超时时间，单位秒
    save_map_timeout: 5.0

    # 低于该概率的栅格视为空闲
    free_thresh_default: 0.25

    # 高于该概率的栅格视为占用
    occupied_thresh_default: 0.65

    # 使用Transient Local QoS接收地图
    map_subscribe_transient_local: True


# =====================================================================
# 8. Planner Server：生成全局路径
# =====================================================================
planner_server:
  ros__parameters:
    # 期望全局规划频率
    expected_planner_frequency: 20.0
    use_sim_time: false

    # 使用名为GridBased的规划插件
    planner_plugins: ["GridBased"]

    GridBased:
      # Navfn全局规划器
      plugin: "nav2_navfn_planner/NavfnPlanner"

      # 如果精确目标点不可达，允许在目标周围0.5 m内寻找可达点
      tolerance: 0.5

      # false使用Dijkstra；true使用A*
      use_astar: false

      # 实车巡检禁止穿越未知区域，避免规划器从灰色区域抄近路。
      allow_unknown: false


# =====================================================================
# 9. Smoother Server：平滑全局路径
# =====================================================================
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

      # 收敛容差
      tolerance: 1.0e-10

      # 最大迭代次数
      max_its: 1000

      # 完成一次平滑后再进行进一步细化
      do_refinement: True


# =====================================================================
# 10. Behavior Server：恢复行为和辅助行为
# =====================================================================
behavior_server:
  ros__parameters:
    # 使用局部代价地图及机器人轮廓
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint

    # 行为执行循环频率
    cycle_frequency: 10.0

    # 可使用的行为插件
    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

    # 恢复行为使用odom坐标系
    global_frame: odom
    robot_base_frame: base_footprint

    transform_tolerance: 0.1
    use_sim_time: false

    # 执行动作前向仿真2秒，检查是否安全
    simulate_ahead_time: 2.0

    # 恢复旋转行为速度限制
    max_rotational_vel: 0.4
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.8


# =====================================================================
# 11. Robot State Publisher时间设置
# =====================================================================
robot_state_publisher:
  ros__parameters:
    use_sim_time: false


# =====================================================================
# 12. Waypoint Follower：多航点导航
# =====================================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: false

    # 航点执行循环频率
    loop_rate: 20

    # 某个航点失败后是否继续后续航点
    stop_on_failure: false

    # 每到一个航点执行等待任务
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True

      # 在航点停留时间，单位毫秒；200表示0.2秒
      waypoint_pause_duration: 200


# =====================================================================
# 13. Velocity Smoother：最终速度平滑和限幅
# =====================================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: false

    # 平滑器以20 Hz输出速度
    smoothing_frequency: 20.0

    # 超过限制时是否按比例同时缩放三个速度分量
    scale_velocities: False

    # OPEN_LOOP表示不使用实际里程计速度闭环修正，仅根据命令进行平滑
    feedback: "OPEN_LOOP"

    # [linear.x, linear.y, angular.z]
    # 与 DWB 的首轮巡检限速保持一致。
    max_velocity: [0.10, 0.10, 0.40]
    min_velocity: [-0.10, -0.10, -0.40]

    # 最大加速度和减速度
    max_accel: [0.30, 0.30, 0.80]
    max_decel: [-0.30, -0.30, -0.80]

    # 若以后改为CLOSED_LOOP，会使用此里程计话题反馈
    odom_topic: "odom"

    # 里程计数据允许的最长时间
    odom_duration: 0.1

    # 速度死区；当前不额外设置软件死区
    deadband_velocity: [0.0, 0.0, 0.0]

    # 超过1秒没收到新速度命令时输出0，防止机器人持续运动
    velocity_timeout: 1.0
